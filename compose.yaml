name: pulseops

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulse_ops_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      PHX_HOST: localhost
      PORT: "4000"
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      # Named volumes shadow the bind mount: BEAM artefacts stay Linux-native
      # and off the Windows filesystem, which keeps recompiles fast.
      - build:/app/_build
      - deps:/app/deps
    stdin_open: true
    tty: true

volumes:
  pgdata:
  build:
  deps:
