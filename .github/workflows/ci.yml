name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to a branch makes the run in progress pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  test:
    name: format, credo, test, dialyzer
    runs-on: ubuntu-latest

    # The image the project is developed in (ADR-007), so CI and a developer's
    # machine run the same toolchain rather than two that happen to agree.
    #
    # This is not only about parity. The OTP build that erlef/setup-beam
    # installs ships without dialyzer's erl_bif_types.beam, so Dialyzer could
    # not start at all: "File not found: .../dialyzer-5.4.0.1/ebin/erl_bif_types.beam".
    # The official image carries the same Dialyzer version, complete.
    container:
      image: elixir:1.20-otp-28

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulse_ops_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # From inside a job container the database is reachable by its service
      # label, not on localhost — which happens to be the same "db" the local
      # compose file uses.
      DATABASE_HOST: db

    steps:
      - uses: actions/checkout@v4

      - name: Install Hex and rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Restore dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-elixir-1.20-otp-28-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-elixir-1.20-otp-28-mix-

      # Kept separate from the build cache: the PLT is expensive to build and
      # only changes when the dependency set does.
      - name: Restore Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-elixir-1.20-otp-28-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-elixir-1.20-otp-28-plt-

      - run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - run: mix credo --strict

      # --cover rather than a bare `mix test`: the threshold in mix.exs fails the
      # build if coverage drops, which is the only thing that makes the number
      # worth measuring.
      - name: Test with coverage
        run: mix test --cover

      - name: Create the PLT directory
        run: mkdir -p priv/plts

      - run: mix dialyzer --format github
